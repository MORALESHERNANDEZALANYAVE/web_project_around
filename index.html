<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Yavé Hernández" />
    <meta
      name="description"
      content="Esta es una página interactiva en la que los usuarios pueden añadir, eliminar o dar me gusta a las fotos."
    />
    <meta name="keywords" content="Galeria, Tripleten" />

    <title>Around</title>

    <link rel="stylesheet" href="./pages/index.css" />
    <link rel="stylesheet" href="./vendor/fonts.css" />
    <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon" />
  </head>

  <body>
    <div class="page">
      <header class="header">
        <img class="header__image" src="./images/vector.svg" alt="Titulo" />
        <hr class="header__line" />
      </header>

      <main class="main">
        <section class="profile">
          <img
            class="profile__image"
            src="./images/avatar.png"
            alt="Foto de perfil"
          />
          <div class="profile__info">
            <h1 class="profile__name">Jacques Cousteau</h1>
            <button class="profile__edit-button">
              <img src="./images/Edit-Button.svg" alt="Boton de editar" />
            </button>
            <h2 class="profile__job">Explorador</h2>
          </div>

          <div class="profile__add-button">
            <button
              class="profile__button"
              alt="Boton de agregar"
              type="button"
            >
              &#128930;
            </button>
          </div>
        </section>

        <section class="elements"></section>
      </main>

      <div class="popup">
        <div class="popup__container">
          <button class="popup__close" type="button">&#x1F7A9;</button>

          <form class="popup__form" id="form_edit-profile">
            <h3 class="popup__form-title">Editar perfil</h3>
            <label class="popup__label">
              <input
                type="text"
                class="popup__input"
                placeholder="Nombre"
                id="name"
                name="name"
              />
            </label>
            <label class="popup__label">
              <input
                type="text"
                class="popup__input"
                placeholder="Acerca de mí"
                id="about"
                name="about"
              />
            </label>
            <button class="popup__button" type="submit">Guardar</button>
          </form>
        </div>
      </div>

      <div class="popup popup_add-card">
        <div class="popup__container">
          <button class="popup__close popup__close_add-card" type="button">
            &#x1F7A9;
          </button>

          <form class="popup__form popup__form_add-card">
            <h3 class="popup__form-title">Nuevo lugar</h3>

            <label class="popup__label">
              <input
                type="text"
                class="popup__input"
                placeholder="Titulo"
                name="title"
                required
              />
            </label>

            <label class="popup__label">
              <input
                type="url"
                class="popup__input"
                placeholder="Enlace a la imagen"
                name="link"
                required
              />
            </label>

            <button class="popup__button" type="submit">Crear</button>
          </form>
        </div>
      </div>

      <div class="popup popup_image">
        <div class="popup__container popup__container_image">
          <button class="popup__close popup__close_image" type="button">
            &#x1F7A9;
          </button>

          <img class="popup__image" src="" alt="" />
          <p class="popup__caption"></p>
        </div>
      </div>

      <footer class="footer">
        <p class="footer__copyright">&copy; Alan Yavé Morales Hernández 2024</p>
      </footer>
    </div>

    <script src="./scripts/index.js"></script>
  </body>
</html>
